name: Deploy KI Learning Studio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "interactive/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Studio JS syntax
        run: node --check interactive/js/*.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload interactive studio artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "interactive"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
