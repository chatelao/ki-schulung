# Beispiel-Workflow: CI-Qualitätsprüfung für Dokumentation + optionaler Read-the-Docs-Trigger
# Aktivierung: Datei nach .github/workflows/docs-ci.yml kopieren.

name: Docs CI (Quality Checks & Optional RTD Trigger)

on:
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - ".readthedocs.yaml"
  push:
    branches: ["main"]
    paths:
      - "**.md"
      - "docs/**"
      - ".readthedocs.yaml"

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Einfacher Struktur- & Markdown-Check
        run: |
          echo "Prüfe, ob zentrale Dokumentationsdateien vorhanden sind..."
          test -f README.md
          echo "Basis-Check erfolgreich."

      # Optional: Link-Checker für Markdown-Dateien (z. B. lychee)
      - name: Links in Markdown prüfen
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline "**/*.md"
          fail: true

  # Optionaler Job: Read the Docs Build gezielt über die API anstoßen
  # (Hinweis: Standardmäßig baut Read the Docs bereits automatisch per GitHub-Webhook.
  # Dieser Job ist hilfreich, wenn der Build erst nach erfolgreicher CI-Prüfung starten soll.)
  trigger-readthedocs:
    runs-on: ubuntu-latest
    needs: docs-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RTD_PROJECT_SLUG != ''
    steps:
      - name: Read the Docs Build per API auslösen
        env:
          RTD_TOKEN: ${{ secrets.RTD_API_TOKEN }}
          RTD_PROJECT_SLUG: ${{ vars.RTD_PROJECT_SLUG }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Token ${RTD_TOKEN}" \
            "https://app.readthedocs.org/api/v3/projects/${RTD_PROJECT_SLUG}/versions/latest/builds/"
